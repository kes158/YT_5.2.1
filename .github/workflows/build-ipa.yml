name: Build YTPlus IPA

on:
  workflow_dispatch:
    inputs:
      decrypted_ipa_url:
        description: 'Decrypted YouTube IPA direct download URL'
        required: true
        type: string

      # ── 기본 설정 ──────────────────────────────────────────
      ytplus_version:
        description: 'YTPlus Tweak Version'
        required: true
        default: '5.2.1'
        type: string

      app_name:
        description: 'App Name (Optional)'
        required: true
        default: 'YouTube'
        type: string

      bundle_id:
        description: 'BundleID (Optional)'
        required: true
        default: 'com.google.ios.youtube'
        type: string

      # ── 트윅 업데이트 옵션 ─────────────────────────────────
      update_tweaks:
        description: 'Check for tweak updates and rebuild (re-clones all sources)'
        required: false
        default: false
        type: boolean

      # ── 트윅 선택 ──────────────────────────────────────────
      enable_youpip:
        description: 'YouPiP'
        required: false
        default: true
        type: boolean

      enable_ytuhd:
        description: 'YTUHD'
        required: false
        default: true
        type: boolean

      enable_yq:
        description: 'YouQuality'
        required: false
        default: true
        type: boolean

      enable_ycq:
        description: 'YouChooseQuality'
        required: false
        default: true
        type: boolean

      enable_ryd:
        description: 'Return YouTube Dislikes'
        required: false
        default: true
        type: boolean

      enable_ytabc:
        description: 'YTABConfig'
        required: false
        default: true
        type: boolean

      enable_demc:
        description: 'DontEatMyContent'
        required: false
        default: true
        type: boolean

      enable_youloop:
        description: 'YouLoop'
        required: false
        default: true
        type: boolean

      enable_youspeed:
        description: 'YouSpeed'
        required: false
        default: true
        type: boolean

      enable_ytx:
        description: 'YouTube X'
        required: false
        default: true
        type: boolean

      include_open_youtube:
        description: 'Open in YouTube Safari extension'
        required: false
        default: true
        type: boolean
      # ───────────────────────────────────────────────────────

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  # 저장소 내 캐시 deb 보관 경로
  DEB_CACHE_DIR: tweaks/prebuilt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTPlus IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      # ── 1. 버전 추출 ────────────────────────────────────────
      - name: Extract YouTube version from URL
        id: version
        run: |
          URL="${{ github.event.inputs.decrypted_ipa_url }}"
          YT_VERSION=$(echo "$URL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [[ -z "$YT_VERSION" ]]; then
            echo "❌ URL에서 유튜브 버전을 찾을 수 없습니다."
            exit 1
          fi
          echo "✅ YouTube 버전: $YT_VERSION"
          YTLITE_VER="${{ github.event.inputs.ytplus_version }}"
          echo "yt_version=$YT_VERSION"                              >> "$GITHUB_OUTPUT"
          echo "ipa_name=YTPlus_${YTLITE_VER}_${YT_VERSION}.ipa"    >> "$GITHUB_OUTPUT"
          echo "release_tag=YTPlus_${YTLITE_VER}_${YT_VERSION}"     >> "$GITHUB_OUTPUT"
          echo "ytplus_version=${YTLITE_VER}"                        >> "$GITHUB_OUTPUT"

          TWEAK_LIST="YTPlus"
          [[ "${{ github.event.inputs.enable_ytabc }}"         == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nYTABConfig"
          [[ "${{ github.event.inputs.enable_yq }}"            == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nYouQuality"
          [[ "${{ github.event.inputs.enable_ycq }}"           == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nYouChooseQuality"
          [[ "${{ github.event.inputs.enable_ryd }}"           == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nReturn YouTube Dislikes"
          [[ "${{ github.event.inputs.enable_demc }}"          == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nDontEatMyContent"
          [[ "${{ github.event.inputs.enable_youpip }}"        == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nYouPiP"
          [[ "${{ github.event.inputs.enable_ytuhd }}"         == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nYTUHD"
          [[ "${{ github.event.inputs.enable_youloop }}"       == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nYouLoop"
          [[ "${{ github.event.inputs.enable_youspeed }}"      == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nYouSpeed"
          [[ "${{ github.event.inputs.enable_ytx }}"           == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nYouTube X"
          [[ "${{ github.event.inputs.include_open_youtube }}" == "true" ]] && TWEAK_LIST="$TWEAK_LIST\nOpenYouTubeSafariExtension"

          {
            echo "release_notes<<EOF"
            echo "Updated to YouTube v${YT_VERSION}"
            echo ""
            echo "Included Tweaks:"
            echo ""
            echo -e "$TWEAK_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 2. 저장소 체크아웃 ─────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 트윅 deb 업데이트 커밋을 위해 전체 히스토리 필요
          fetch-depth: 0

      # ── 3. 트윅 repo HEAD SHA 일괄 조회 (update_tweaks 시에만) ──
      - name: Fetch tweak repo SHAs (parallel)
        id: sha
        if: ${{ inputs.update_tweaks }}
        run: |
          get_sha() { git ls-remote "$1" HEAD 2>/dev/null | awk '{print $1}' | cut -c1-12; }

          get_sha https://github.com/PoomSmart/YouGroupSettings        > /tmp/sha_ygs &
          get_sha https://github.com/PoomSmart/YTVideoOverlay          > /tmp/sha_ytvo &
          get_sha https://github.com/PoomSmart/YouPiP                  > /tmp/sha_youpip &
          get_sha https://github.com/Tonwalter888/YTUHD                > /tmp/sha_ytuhd &
          get_sha https://github.com/PoomSmart/YouQuality              > /tmp/sha_yq &
          get_sha https://github.com/PoomSmart/YouChooseQuality        > /tmp/sha_ycq &
          get_sha https://github.com/PoomSmart/Return-YouTube-Dislikes > /tmp/sha_ryd &
          get_sha https://github.com/PoomSmart/YTABConfig              > /tmp/sha_ytabc &
          get_sha https://github.com/therealFoxster/DontEatMyContent   > /tmp/sha_demc &
          get_sha https://github.com/bhackel/YouLoop                   > /tmp/sha_youloop &
          get_sha https://github.com/PoomSmart/YouSpeed                > /tmp/sha_youspeed &
          get_sha https://github.com/PoomSmart/YouTubeHeader           > /tmp/sha_headers &
          get_sha https://github.com/PoomSmart/PSHeader                > /tmp/sha_psheader &
          wait

          echo "ygs=$(cat /tmp/sha_ygs)"           >> "$GITHUB_OUTPUT"
          echo "ytvo=$(cat /tmp/sha_ytvo)"          >> "$GITHUB_OUTPUT"
          echo "youpip=$(cat /tmp/sha_youpip)"      >> "$GITHUB_OUTPUT"
          echo "ytuhd=$(cat /tmp/sha_ytuhd)"        >> "$GITHUB_OUTPUT"
          echo "yq=$(cat /tmp/sha_yq)"             >> "$GITHUB_OUTPUT"
          echo "ycq=$(cat /tmp/sha_ycq)"           >> "$GITHUB_OUTPUT"
          echo "ryd=$(cat /tmp/sha_ryd)"           >> "$GITHUB_OUTPUT"
          echo "ytabc=$(cat /tmp/sha_ytabc)"       >> "$GITHUB_OUTPUT"
          echo "demc=$(cat /tmp/sha_demc)"         >> "$GITHUB_OUTPUT"
          echo "youloop=$(cat /tmp/sha_youloop)"   >> "$GITHUB_OUTPUT"
          echo "youspeed=$(cat /tmp/sha_youspeed)" >> "$GITHUB_OUTPUT"
          echo "headers=$(cat /tmp/sha_headers)"   >> "$GITHUB_OUTPUT"
          echo "psheader=$(cat /tmp/sha_psheader)" >> "$GITHUB_OUTPUT"

      # ── 4. brew 캐시 + 의존성 설치 ─────────────────────────
      - name: Cache Homebrew packages
        id: cache-brew
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar/make
            /opt/homebrew/Cellar/ldid
            /opt/homebrew/Cellar/dpkg
            /opt/homebrew/Cellar/libplist
            /opt/homebrew/Cellar/gpatch
            /opt/homebrew/Cellar/libmd
          key: brew-arm64-make-ldid-dpkg-v1

      - name: Install dependencies
        run: |
          if [[ "${{ steps.cache-brew.outputs.cache-hit }}" != 'true' ]]; then
            brew install make ldid dpkg --quiet
          else
            brew link --overwrite make ldid dpkg libplist libmd 2>/dev/null || \
              brew install make ldid dpkg --quiet
          fi
          if ! ldid -v &>/dev/null; then
            echo "⚠️ ldid 동작 실패 → 재설치"
            brew reinstall ldid --quiet
          fi
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH

      # ── 5. Theos 캐시 ──────────────────────────────────────
      - name: Cache Theos
        id: theos
        uses: actions/cache@v4
        env:
          cache-name: theos_cache_9bc7340
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk ${{ github.workspace }}/theos/sdks

      # ── 6. cyan 캐시 + 설치 ────────────────────────────────
      - name: Cache cyan (pipx)
        id: cache-cyan
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/pipx
            ~/.local/bin
          key: cyan-pyzule-rw-main-v2

      - name: Install cyan
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          if [[ ! -x "$HOME/.local/bin/cyan" ]]; then
            echo "cyan 바이너리 없음 → 설치"
            pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          else
            echo "✅ cyan 캐시 복원 확인: $HOME/.local/bin/cyan"
          fi

      # ── 7. IPA + YTLite deb 병렬 다운로드 ─────────────────
      - name: Download decrypted YouTube IPA + YTPlus deb
        run: |
          wget "${{ github.event.inputs.decrypted_ipa_url }}" --no-verbose -O youtube.ipa
          echo "✅ IPA 다운로드 완료"
          YTPLUS_DEB="${{ github.workspace }}/${{ env.DEB_CACHE_DIR }}/ytplus.deb"
          if [[ ! -f "$YTPLUS_DEB" ]]; then
            echo "❌ tweaks/prebuilt/ytplus.deb 파일이 없습니다."
            exit 1
          fi
          cp "$YTPLUS_DEB" "${{ github.workspace }}/ytplus.deb"
          echo "✅ ytplus.deb 복사 완료"

      # ══════════════════════════════════════════════════════
      # [모드 A] 저장소 캐시 deb 복사 (update_tweaks = false)
      # 저장소의 tweaks/prebuilt/ 안에 있는 deb를 작업 디렉터리로 복사
      # ══════════════════════════════════════════════════════
      - name: Use cached debs from repository
        if: ${{ !inputs.update_tweaks }}
        run: |
          CACHE_DIR="${{ github.workspace }}/${{ env.DEB_CACHE_DIR }}"
          if [[ ! -d "$CACHE_DIR" ]]; then
            echo "❌ $CACHE_DIR 폴더가 없습니다."
            echo "   처음 사용 시 'Check for tweak updates' 옵션을 켜고 한 번 실행해 deb를 생성하세요."
            exit 1
          fi
          echo "📦 저장소 캐시 deb 복사 중..."
          for deb in "$CACHE_DIR"/*.deb; do
            [[ -e "$deb" ]] && cp "$deb" "${{ github.workspace }}/" && echo "  ✅ $(basename $deb)"
          done
          echo "✅ 저장소 캐시 deb 복사 완료"

      # ══════════════════════════════════════════════════════
      # [모드 B] 트윅 최신 소스 클론+빌드 (update_tweaks = true)
      # 빌드 후 tweaks/prebuilt/ 에 커밋하여 저장소에 보관
      # ══════════════════════════════════════════════════════

      # ── 공통 헤더 캐시 + 클론 (update_tweaks 시에만) ───────
      - name: Cache shared headers
        id: cache-headers
        if: ${{ inputs.update_tweaks }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/include/YouTubeHeader
          key: headers-${{ steps.sha.outputs.headers }}-${{ steps.sha.outputs.psheader }}

      - name: Clone shared headers
        if: ${{ inputs.update_tweaks && steps.cache-headers.outputs.cache-hit != 'true' }}
        run: |
          THEOS=${{ github.workspace }}/theos
          cd $THEOS/include
          rm -rf YouTubeHeader PSHeader
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git

      - name: Setup YTHeaders (DontEatMyContent)
        if: ${{ inputs.update_tweaks && inputs.enable_demc }}
        run: |
          THEOS=${{ github.workspace }}/theos
          cd $THEOS/include
          rm -rf YTHeaders
          cp -r YouTubeHeader YTHeaders

      # ── YouGroupSettings ───────────────────────────────────
      - name: Cache YouGroupSettings deb
        id: cache-ygs
        if: ${{ inputs.update_tweaks && (inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ycq || inputs.enable_ryd || inputs.enable_demc || inputs.enable_youloop || inputs.enable_youspeed) }}
        uses: actions/cache@v4
        with:
          path: ygs.deb
          key: deb-ygs-${{ steps.sha.outputs.ygs }}

      - name: Clone + Build YouGroupSettings
        if: ${{ inputs.update_tweaks && (inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ycq || inputs.enable_ryd || inputs.enable_demc || inputs.enable_youloop || inputs.enable_youspeed) && steps.cache-ygs.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git
          cd YouGroupSettings && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ygs.deb

      # ── YTVideoOverlay ─────────────────────────────────────
      - name: Cache YTVideoOverlay deb
        id: cache-ytvo
        if: ${{ inputs.update_tweaks && (inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ycq || inputs.enable_youloop || inputs.enable_youspeed) }}
        uses: actions/cache@v4
        with:
          path: ytvo.deb
          key: deb-ytvo-${{ steps.sha.outputs.ytvo }}

      - name: Clone + Build YTVideoOverlay
        if: ${{ inputs.update_tweaks && (inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ycq || inputs.enable_youloop || inputs.enable_youspeed) && steps.cache-ytvo.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          cd YTVideoOverlay && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ytvo.deb

      - name: Ensure YTVideoOverlay source (header guard)
        if: ${{ inputs.update_tweaks && (inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ycq || inputs.enable_youloop || inputs.enable_youspeed) }}
        run: |
          if [[ ! -d YTVideoOverlay ]]; then
            echo "YTVideoOverlay 소스 없음 (캐시 히트) → 헤더용으로 클론"
            git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          else
            echo "✅ YTVideoOverlay 소스 이미 존재"
          fi

      # ── YouPiP ─────────────────────────────────────────────
      - name: Cache YouPiP deb
        id: cache-youpip
        if: ${{ inputs.update_tweaks && inputs.enable_youpip }}
        uses: actions/cache@v4
        with:
          path: youpip.deb
          key: deb-youpip-${{ steps.sha.outputs.youpip }}

      - name: Clone + Build YouPiP
        if: ${{ inputs.update_tweaks && inputs.enable_youpip && steps.cache-youpip.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
          cd YouPiP && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../youpip.deb

      # ── YTUHD ──────────────────────────────────────────────
      - name: Cache YTUHD deb
        id: cache-ytuhd
        if: ${{ inputs.update_tweaks && inputs.enable_ytuhd }}
        uses: actions/cache@v4
        with:
          path: ytuhd.deb
          key: deb-ytuhd-${{ steps.sha.outputs.ytuhd }}

      - name: Clone + Build YTUHD
        if: ${{ inputs.update_tweaks && inputs.enable_ytuhd && steps.cache-ytuhd.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/Tonwalter888/YTUHD.git

          # ── YTUHD 빌드 (서브모듈 없음, libvpx/dav1d 불필요) ─
          cd YTUHD
          make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ytuhd.deb

      # ── YouQuality ─────────────────────────────────────────
      - name: Cache YouQuality deb
        id: cache-yq
        if: ${{ inputs.update_tweaks && inputs.enable_yq }}
        uses: actions/cache@v4
        with:
          path: yq.deb
          key: deb-yq-${{ steps.sha.outputs.yq }}

      - name: Clone + Build YouQuality
        if: ${{ inputs.update_tweaks && inputs.enable_yq && steps.cache-yq.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouQuality.git
          cd YouQuality && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../yq.deb

      # ── YouChooseQuality ───────────────────────────────────
      - name: Cache YouChooseQuality deb
        id: cache-ycq
        if: ${{ inputs.update_tweaks && inputs.enable_ycq }}
        uses: actions/cache@v4
        with:
          path: ycq.deb
          key: deb-ycq-${{ steps.sha.outputs.ycq }}

      - name: Clone + Build YouChooseQuality
        if: ${{ inputs.update_tweaks && inputs.enable_ycq && steps.cache-ycq.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouChooseQuality.git
          YCQ_BUNDLE=$(find YouChooseQuality/layout -type d -name "*.bundle" 2>/dev/null | head -1)
          if [[ -n "$YCQ_BUNDLE" ]]; then
            mkdir -p "$YCQ_BUNDLE/ko.lproj"
            printf '%s\n' \
              '"TWEAK_NAME" = "YouChooseQuality";' \
              '"TWEAK_DESC" = "각 상황별로 지정한 화질과 동일하거나 가장 가까운 화질을 자동으로 선택합니다.";' \
              '"ENABLED" = "활성화";' \
              '"QUALITY_FOR_SCENARIO_0_SHORT" = "Wi-Fi";' \
              '"QUALITY_FOR_SCENARIO_0" = "Wi-Fi 연결 시 기본 화질";' \
              '"QUALITY_FOR_SCENARIO_1_SHORT" = "셀룰러";' \
              '"QUALITY_FOR_SCENARIO_1" = "셀룰러(모바일 데이터) 연결 시 기본 화질";' \
              '"QUALITY_FOR_SCENARIO_2_SHORT" = "Wi-Fi (AirPlay)";' \
              '"QUALITY_FOR_SCENARIO_2" = "AirPlay 사용 중 Wi-Fi 연결 시 기본 화질";' \
              '"QUALITY_FOR_SCENARIO_3_SHORT" = "셀룰러 (AirPlay)";' \
              '"QUALITY_FOR_SCENARIO_3" = "AirPlay 사용 중 셀룰러 연결 시 기본 화질";' \
              '"QUALITY_FOR_SCENARIO_4_SHORT" = "저전력 모드";' \
              '"QUALITY_FOR_SCENARIO_4" = "저전력 모드 활성화 시 기본 화질";' \
              > "$YCQ_BUNDLE/ko.lproj/Localizable.strings"
          fi
          cd YouChooseQuality && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ycq.deb

      # ── Return-YouTube-Dislikes ────────────────────────────
      - name: Cache Return-YouTube-Dislikes deb
        id: cache-ryd
        if: ${{ inputs.update_tweaks && inputs.enable_ryd }}
        uses: actions/cache@v4
        with:
          path: ryd.deb
          key: deb-ryd-${{ steps.sha.outputs.ryd }}

      - name: Clone + Build Return-YouTube-Dislikes
        if: ${{ inputs.update_tweaks && inputs.enable_ryd && steps.cache-ryd.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git
          cd Return-YouTube-Dislikes && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ryd.deb

      # ── YTABConfig ─────────────────────────────────────────
      - name: Cache YTABConfig deb
        id: cache-ytabc
        if: ${{ inputs.update_tweaks && inputs.enable_ytabc }}
        uses: actions/cache@v4
        with:
          path: ytabc.deb
          key: deb-ytabc-${{ steps.sha.outputs.ytabc }}

      - name: Clone + Build YTABConfig
        if: ${{ inputs.update_tweaks && inputs.enable_ytabc && steps.cache-ytabc.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git
          cd YTABConfig && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ytabc.deb

      # ── DontEatMyContent ───────────────────────────────────
      - name: Cache DontEatMyContent deb
        id: cache-demc
        if: ${{ inputs.update_tweaks && inputs.enable_demc }}
        uses: actions/cache@v4
        with:
          path: demc.deb
          key: deb-demc-${{ steps.sha.outputs.demc }}

      - name: Clone + Build DontEatMyContent
        if: ${{ inputs.update_tweaks && inputs.enable_demc && steps.cache-demc.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git
          sed -i '' "s/^CGFloat constant;/extern CGFloat constant;/" DontEatMyContent/Tweak.h
          perl -i -0pe 's/^(static CGFloat videoAspectRatio)/CGFloat constant = 0.0;\n$1/m' DontEatMyContent/Tweak.x
          cd DontEatMyContent && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../demc.deb

      # ── YouLoop ────────────────────────────────────────────
      - name: Cache YouLoop deb
        id: cache-youloop
        if: ${{ inputs.update_tweaks && inputs.enable_youloop }}
        uses: actions/cache@v4
        with:
          path: youloop.deb
          key: deb-youloop-${{ steps.sha.outputs.youloop }}

      - name: Clone + Build YouLoop
        if: ${{ inputs.update_tweaks && inputs.enable_youloop && steps.cache-youloop.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/bhackel/YouLoop.git
          cd YouLoop && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../youloop.deb

      # ── YouSpeed ───────────────────────────────────────────
      - name: Cache YouSpeed deb
        id: cache-youspeed
        if: ${{ inputs.update_tweaks && inputs.enable_youspeed }}
        uses: actions/cache@v4
        with:
          path: youspeed.deb
          key: deb-youspeed-${{ steps.sha.outputs.youspeed }}

      - name: Clone + Build YouSpeed
        if: ${{ inputs.update_tweaks && inputs.enable_youspeed && steps.cache-youspeed.outputs.cache-hit != 'true' }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSpeed.git
          cd YouSpeed && make package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../youspeed.deb

      # ── YouTube X (prebuilt) ───────────────────────────────
      # tweaks/prebuilt/ytx.deb 를 작업 디렉터리로 복사
      - name: Use YouTube X prebuilt deb
        if: ${{ inputs.enable_ytx }}
        run: |
          YTX_PREBUILT="${{ github.workspace }}/${{ env.DEB_CACHE_DIR }}/ytx.deb"
          if [[ ! -f "$YTX_PREBUILT" ]]; then
            echo "❌ tweaks/prebuilt/ytx.deb 파일이 없습니다."
            echo "   com_ps_ytx_1_7_22_iphoneos-arm.deb 를 tweaks/prebuilt/ytx.deb 로 이름 바꿔서 커밋하세요."
            exit 1
          fi
          cp "$YTX_PREBUILT" "${{ github.workspace }}/ytx.deb"
          echo "✅ YouTube X prebuilt deb 복사 완료"

      # ── 빌드된 deb를 저장소에 커밋 (update_tweaks 시에만) ──
      - name: Save updated debs to repository
        if: ${{ inputs.update_tweaks }}
        run: |
          CACHE_DIR="${{ github.workspace }}/${{ env.DEB_CACHE_DIR }}"
          mkdir -p "$CACHE_DIR"

          echo "📦 새로 빌드된 deb를 저장소 캐시로 보관..."
          UPDATED=0
          for deb in ygs.deb ytvo.deb youpip.deb ytuhd.deb yq.deb ycq.deb \
                     ryd.deb ytabc.deb demc.deb youloop.deb youspeed.deb; do
            if [[ -f "${{ github.workspace }}/$deb" ]]; then
              cp "${{ github.workspace }}/$deb" "$CACHE_DIR/$deb"
              echo "  ✅ $deb 보관 완료"
              UPDATED=$((UPDATED+1))
            fi
          done

          if [[ $UPDATED -eq 0 ]]; then
            echo "⚠️ 보관할 새 deb 없음 (모두 캐시 히트)"
          fi

          # git 설정 및 커밋
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CACHE_DIR"

          if git diff --cached --quiet; then
            echo "ℹ️ deb 변경 없음 → 커밋 생략"
          else
            BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: update prebuilt tweaks [$BUILD_DATE]"
            git push
            echo "✅ 저장소에 최신 deb 커밋 완료"
          fi

      # ── Open in YouTube Safari extension ───────────────────
      - name: Prepare OpenYouTubeSafariExtension
        if: ${{ inputs.include_open_youtube }}
        run: |
          APPEX_ZIP="${{ github.workspace }}/${{ env.DEB_CACHE_DIR }}/OpenYouTubeSafariExtension.appex.zip"
          if [[ ! -f "$APPEX_ZIP" ]]; then
            echo "❌ $APPEX_ZIP 파일이 없습니다."
            echo "   tweaks/prebuilt/ 에 OpenYouTubeSafariExtension.appex.zip 을 추가하세요."
            exit 1
          fi
          echo "📦 OpenYouTubeSafariExtension.appex.zip 압축 해제 중..."
          unzip -o "$APPEX_ZIP" -d "${{ github.workspace }}/"
          echo "✅ OpenYouTubeSafariExtension.appex 준비 완료"

      # ── IPA 인젝션 ─────────────────────────────────────────
      - name: Inject tweaks into IPA
        run: |
          tweaks="ytplus.deb"
          for f in *.deb *.appex; do
            [[ -e "$f" ]] && [[ "$f" != "ytplus.deb" ]] && tweaks="$tweaks $f"
          done
          echo "인젝션할 트윅: $tweaks"
          cyan -i youtube.ipa \
               -o "${{ steps.version.outputs.ipa_name }}" \
               -uwef $tweaks \
               -n "${{ github.event.inputs.app_name }}" \
               -b "${{ github.event.inputs.bundle_id }}"

      # ── 패트리온 패치 ──────────────────────────────────────
      - name: Apply no-patreon patch
        run: |
          IPA="${{ steps.version.outputs.ipa_name }}"
          echo "🔧 패트리온 제거 패치 적용 중..."
          cd YTplus_patch
          python3 patch_ytlite_package_no_patreon_52x.py "../$IPA"
          mv "../${IPA%.ipa}-no-patreon.ipa" "../$IPA"
          echo "✅ 패치 완료"

      # ── GitHub Release 업로드 ──────────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ steps.version.outputs.release_tag }}
          name:      ${{ steps.version.outputs.release_tag }}
          body:      ${{ steps.version.outputs.release_notes }}
          files:     ${{ steps.version.outputs.ipa_name }}
          fail_on_unmatched_files: true
